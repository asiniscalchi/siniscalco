[package]
name = "backend"
version = "0.10.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "schema-export"
path = "src/bin/schema_export.rs"

[dependencies]
async-graphql = { version = "7.2.1", features = ["chrono"] }
async-graphql-axum = "7.2.1"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
if-addrs = "0.13.4"
indexmap = "2.14.0"
futures-util = "0.3.34"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "1.8.0", features = ["server", "macros", "transport-streamable-http-server"] }
rust_decimal = "1.42.1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["migrate", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
